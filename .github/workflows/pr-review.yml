name: PR review

# Advisory checks that flag risky changes for a human reviewer.
# Lint, test and build failures are reported (and block merges) by ci.yml.
on:
  pull_request:

concurrency:
  group: pr-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  risk:
    name: Flag risky changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      # The PR merge commit plus its parents, so HEAD^1 is the current base branch.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # No npm install needed: the script only uses Node built-ins.
      - name: Check diff for risky changes
        run: node scripts/risk-check.js HEAD^1
