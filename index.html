<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rhomboulds Arcade — an online games portal." />
    <title>Rhomboulds Arcade</title>
  </head>
  <body>
    <header class="site-header">
      <h1>Rhomboulds Arcade</h1>
      <p class="tagline">An online games portal.</p>
    </header>

    <main>
      <section class="games" aria-labelledby="games-heading">
        <h2 id="games-heading">Games</h2>
        <ul class="game-list">
          <li>
            <a class="game-card" href="games/tic-tac-toe/">
              <span class="game-card-title">Tic-Tac-Toe</span>
              <span class="game-card-desc">Two players, one screen. Get three in a row to win.</span>
            </a>
          </li>
        </ul>
      </section>
    </main>

    <footer class="site-footer">
      <p class="status" data-status data-state="pending" role="status">
        <span class="status-dot" aria-hidden="true"></span>
        <span data-status-text>Checking status…</span>
        <a href="health.json">health.json</a>
      </p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
