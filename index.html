<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rhomboulds Arcade — an online games portal." />
    <title>Rhomboulds Arcade</title>
  </head>
  <body>
    <header class="site-header">
      <h1>Rhomboulds Arcade</h1>
      <p class="tagline">An online games portal.</p>
